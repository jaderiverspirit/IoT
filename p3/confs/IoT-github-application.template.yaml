apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iot-github
  namespace: argocd
spec:
  project: default
  source:
    repoURL: __IOT_GITHUB_URL__
    targetRevision: feature/debian13
    path: p3/confs/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
