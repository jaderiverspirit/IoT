apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iot-gitlab
  namespace: argocd
spec:
  project: default
  source:
    # DNS-resolvable IN the K3d cluster. This points to locally hosted GitLab,
    # not github.com and not a repository reachable only from the Linux VM.
    repoURL: http://gitlab.gitlab.svc.cluster.local:8081/root/iot-gitops.git
    targetRevision: main
    path: p3/confs/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
