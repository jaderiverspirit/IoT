apiVersion: v1
kind: ConfigMap
metadata:
  name: iot-app1-html
data:
  index.html: |
    <!doctype html>
    <html lang="en"><head><meta charset="utf-8"><title>IoT app1</title></head>
    <body><h1>Hello from app1.</h1><p>Inception-of-Things | K3s | app1</p></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iot-app1
  template:
    metadata:
      labels:
        app: iot-app1
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 96Mi
              cpu: 200m
      volumes:
        - name: site
          configMap:
            name: iot-app1-html
---
apiVersion: v1
kind: Service
metadata:
  name: iot-app1
spec:
  selector:
    app: iot-app1
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
