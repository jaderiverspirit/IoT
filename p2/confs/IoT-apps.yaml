apiVersion: v1
kind: ConfigMap
metadata:
  name: iot-app3-html
data:
  index.html: |
    <!doctype html>
    <html lang="en"><head><meta charset="utf-8"><title>IoT app3</title></head>
    <body><h1>Hello from app3.</h1><p>Inception-of-Things | K3s | app3</p></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-app3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iot-app3
  template:
    metadata:
      labels:
        app: iot-app3
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 96Mi
              cpu: 200m
      volumes:
        - name: site
          configMap:
            name: iot-app3-html
---
apiVersion: v1
kind: Service
metadata:
  name: iot-app3
spec:
  selector:
    app: iot-app3
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iot-routing
spec:
  ingressClassName: traefik
  rules:
    # Route app1.com to App1.
    - host: app1.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iot-app1
                port:
                  number: 80

    # Route app2.com to App2.
    - host: app2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iot-app2
                port:
                  number: 80

    # No host specified: match requests for any hostname.
    # This is the fallback route to App3.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iot-app3
                port:
                  number: 80
